<svg viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0a0f1f"/>
			<stop offset="55%" stop-color="#111827"/>
			<stop offset="100%" stop-color="#182234"/>
		</linearGradient>
		<radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#34ebd5" stop-opacity="0.30"/>
			<stop offset="100%" stop-color="#34ebd5" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#14c9b3" stop-opacity="0.28"/>
			<stop offset="100%" stop-color="#14c9b3" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#34ebd5" stroke-opacity="0.06" stroke-width="1"/>
		</pattern>
	</defs>

	<rect width="1600" height="400" fill="url(#bg)"/>
	<rect width="1600" height="400" fill="url(#grid)"/>

	<circle cx="230" cy="200" r="170" fill="url(#glowLeft)"/>
	<circle cx="1370" cy="180" r="150" fill="url(#glowRight)"/>

	<!-- A simple code-editor window motif, echoing the book's own built-in editor -->
	<g transform="translate(620,110)">
		<rect x="0" y="0" width="360" height="190" rx="10" fill="#151b2e" stroke="#2c3555" stroke-width="1.5"/>
		<rect x="0" y="0" width="360" height="30" rx="10" fill="#1b2338"/>
		<circle cx="20" cy="15" r="5" fill="#ff5f56"/>
		<circle cx="38" cy="15" r="5" fill="#ffbd2e"/>
		<circle cx="56" cy="15" r="5" fill="#27c93f"/>
		<rect x="24" y="48" width="120" height="8" rx="4" fill="#c586c0" opacity="0.85"/>
		<rect x="24" y="68" width="200" height="8" rx="4" fill="#9cdcfe" opacity="0.85"/>
		<rect x="24" y="88" width="90" height="8" rx="4" fill="#ce9178" opacity="0.85"/>
		<rect x="24" y="108" width="160" height="8" rx="4" fill="#d4d4d4" opacity="0.6"/>
		<rect x="24" y="128" width="130" height="8" rx="4" fill="#569cd6" opacity="0.85"/>
		<rect x="24" y="148" width="70" height="8" rx="4" fill="#4ec9b0" opacity="0.85"/>
	</g>
</svg>
