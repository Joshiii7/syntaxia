<svg viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0a0f1f"/>
			<stop offset="55%" stop-color="#111827"/>
			<stop offset="100%" stop-color="#182234"/>
		</linearGradient>
		<radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#34ebd5" stop-opacity="0.28"/>
			<stop offset="100%" stop-color="#34ebd5" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
			<stop offset="0%" stop-color="#14c9b3" stop-opacity="0.24"/>
			<stop offset="100%" stop-color="#14c9b3" stop-opacity="0"/>
		</radialGradient>
		<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#34ebd5" stroke-opacity="0.06" stroke-width="1"/>
		</pattern>
	</defs>

	<rect width="1600" height="400" fill="url(#bg)"/>
	<rect width="1600" height="400" fill="url(#grid)"/>

	<circle cx="260" cy="200" r="180" fill="url(#glowLeft)"/>
	<circle cx="1360" cy="180" r="150" fill="url(#glowRight)"/>

	<!-- A speech-bubble motif holding a question mark, echoing "questions" -->
	<g transform="translate(150,130)">
		<rect x="0" y="0" width="180" height="110" rx="24" fill="#34ebd5" fill-opacity="0.14" stroke="#93e6da" stroke-opacity="0.6" stroke-width="1.5"/>
		<path d="M40,110 L40,140 L70,110 Z" fill="#34ebd5" fill-opacity="0.14" stroke="#93e6da" stroke-opacity="0.6" stroke-width="1.5"/>
		<text x="90" y="72" font-family="sans-serif" font-size="52" font-weight="700" fill="#93e6da" text-anchor="middle">?</text>
	</g>

	<g transform="translate(1290,220)" opacity="0.85">
		<rect x="0" y="0" width="130" height="80" rx="20" fill="#14c9b3" fill-opacity="0.12" stroke="#8fe3d8" stroke-opacity="0.5" stroke-width="1.4"/>
		<text x="65" y="54" font-family="sans-serif" font-size="38" font-weight="700" fill="#8fe3d8" text-anchor="middle">?</text>
	</g>
</svg>
